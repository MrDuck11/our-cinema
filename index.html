<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎃 Хэллоуинский Кинотеатр 🦇</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08070b; 
            color: #f1f1f5; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }

        /* Главный контейнер динамически адаптируется под вылезающую клавиатуру */
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background: #110e1a;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ff6600;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(255, 102, 0, 0.2);
        }

        header h1 { 
            font-size: 15px; 
            color: #ff7722; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            text-shadow: 0 0 8px rgba(255, 119, 34, 0.6); 
        }

        .url-box {
            display: flex;
            padding: 8px 12px;
            background: #110e1a;
            gap: 8px;
            border-bottom: 1px solid #221b30;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #ff6600;
            background: #08070b;
            color: #fff;
            font-size: 14px; /* Оптимальный размер против автозума iOS */
            outline: none;
        }

        button.btn-main {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff6600, #cc0000);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
            flex-shrink: 0;
        }

        .btn-magic {
            background: linear-gradient(135deg, #6600cc, #9900ff) !important;
            box-shadow: 0 0 10px rgba(153, 0, 255, 0.4) !important;
        }

        .video-wrapper {
            width: 100%;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh; /* Слегка уменьшили, чтобы при клавиатуре оставалось больше места */
            min-height: 180px;
            flex-shrink: 0;
            border-bottom: 1px solid #221b30;
        }

        video, iframe, #yt-player {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0c0a12;
            overflow: hidden;
            min-height: 0;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            background: #181324;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 80%;
            align-self: flex-start;
            word-break: break-word;
            border-bottom-left-radius: 4px;
            border: 1px solid #281e3d;
        }

        .message.my-msg {
            align-self: flex-end;
            background: #ff6600;
            color: white;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 4px;
            border: none;
            box-shadow: 0 0 8px rgba(255, 102, 0, 0.3);
        }

        .reactions-bar {
            display: flex;
            justify-content: space-around;
            padding: 6px;
            background: #110e1a;
            border-top: 1px solid #221b30;
            font-size: 20px;
            flex-shrink: 0;
        }

        .reactions-bar span {
            cursor: pointer;
            transition: transform 0.1s;
        }

        .reactions-bar span:active {
            transform: scale(1.4);
        }

        .chat-input {
            display: flex;
            padding: 8px 12px;
            background: #110e1a;
            gap: 8px;
            flex-shrink: 0;
        }

        .ghost-float {
            position: fixed;
            bottom: 70px;
            font-size: 28px;
            animation: floatUpSpooky 2.5s ease-out forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes floatUpSpooky {
            0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
            50% { transform: translateY(-100px) scale(1.3) rotate(15deg); }
            100% { opacity: 0; transform: translateY(-220px) scale(1) rotate(-15deg); }
        }

        #movie-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #151122;
            border: 2px solid #ff6600;
            padding: 20px;
            border-radius: 16px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }
        .modal-content h3 { color: #ff7722; margin-bottom: 10px; }
        .modal-content p { font-size: 14px; margin-bottom: 15px; color: #ddd; }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>🎃 Наш Хэллоуин 🦇</h1>
            <div style="display: flex; gap: 6px;">
                <button class="btn-main btn-magic" onclick="suggestMovie()">🔮 Фильм</button>
                <button class="btn-main" id="mic-btn" onclick="toggleVoice()">🎙 Голос</button>
            </div>
        </header>

        <div class="url-box">
            <input type="text" id="video-url" placeholder="Ссылка на YouTube или .mp4...">
            <button class="btn-main" onclick="loadUrl()">▶ См</button>
            <label style="background:#221b30; padding:6px 10px; border-radius:20px; font-size:12px; cursor:pointer; display:flex; align-items:center; border: 1px solid #ff6600;">
                📁
                <input type="file" id="file-input" accept="video/*" style="display:none" onchange="loadLocalFile(event)">
            </label>
        </div>

        <div class="video-wrapper">
            <div id="yt-player"></div>
            <video id="html-player" controls playsinline webkit-playsinline style="display:none;"></video>
        </div>

        <div class="chat-section">
            <div class="messages" id="messages"></div>

            <div class="reactions-bar">
                <span onclick="sendReaction('🎃')">🎃</span>
                <span onclick="sendReaction('👻')">👻</span>
                <span onclick="sendReaction('🦇')">🦇</span>
                <span onclick="sendReaction('🍬')">🍬</span>
                <span onclick="sendReaction('💀')">💀</span>
            </div>

            <form class="chat-input" onsubmit="sendMessage(event)">
                <input type="text" id="msg-input" placeholder="Написать заклинание..." onfocus="scrollToBottom()">
                <button class="btn-main" type="submit">></button>
            </form>
        </div>
    </div>

    <div id="movie-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>🔮 Магический шар подсказывает:</h3>
            <p id="movie-text">Нажмите кнопку, чтобы узнать фильм!</p>
            <button class="btn-main" onclick="closeModal()">Понятно, колдуем дальше!</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const roomId = "our-private-cinema";
        socket.emit('join-room', roomId);

        let ytPlayer = null;
        let isApiReady = false;
        let isRemoteAction = false;

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: { 'playsinline': 1, 'controls': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function extractYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadUrl() {
            const url = document.getElementById('video-url').value.trim();
            const ytId = extractYTId(url);
            if (ytId) {
                socket.emit('change-source', { type: 'yt', id: ytId });
            } else if (url) {
                socket.emit('change-source', { type: 'url', src: url });
            }
        }

        function loadLocalFile(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                socket.emit('change-source', { type: 'local', src: fileURL });
            }
        }

        function onPlayerStateChange(event) {
            if (isRemoteAction || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
            const time = ytPlayer.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) {
                socket.emit('video-action', { type: 'play', time: time });
            } else if (event.data === YT.PlayerState.PAUSED) {
                socket.emit('video-action', { type: 'pause', time: time });
            }
        }

        socket.on('video-action', (data) => {
            if (!ytPlayer || typeof ytPlayer.seekTo !== 'function') return;
            isRemoteAction = true;
            const currentTime = ytPlayer.getCurrentTime();
            if (Math.abs(currentTime - data.time) > 1.0) {
                ytPlayer.seekTo(data.time, true);
            }
            if (data.type === 'play') ytPlayer.playVideo();
            else if (data.type === 'pause') ytPlayer.pauseVideo();
            setTimeout(() => { isRemoteAction = false; }, 500);
        });

        socket.on('change-source', (data) => {
            if (data.type === 'yt') {
                document.getElementById('html-player').style.display = 'none';
                document.getElementById('yt-player').style.display = 'block';
                if (isApiReady && ytPlayer && ytPlayer.loadVideoById) {
                    ytPlayer.loadVideoById(data.id);
                }
            } else if (data.type === 'local' || data.type === 'url') {
                document.getElementById('yt-player').style.display = 'none';
                const htmlPlayer = document.getElementById('html-player');
                htmlPlayer.style.display = 'block';
                htmlPlayer.src = data.src;
                htmlPlayer.play();
            }
        });

        const movies = [
            "👻 «Коралина в Стране Кошмаров» — жутко красивая сказка для уютного вечера под пледом.",
            "🦇 «Труп невесты» Тима Бёртона — идеально атмосферно и романтично.",
            "🎃 «Сонная лощина» — туман, мистика и потрясающий вайб Хэллоуина.",
            "💀 «Уэнздей» (пара серий) — стильно, с черным юмором и загадками.",
            "🍬 Любой страшный выпуск любимого шоу или блогера на YouTube!"
        ];

        function suggestMovie() {
            const randomMovie = movies[Math.floor(Math.random() * movies.length)];
            document.getElementById('movie-text').textContent = randomMovie;
            document.getElementById('movie-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('movie-modal').style.display = 'none';
        }

        // Автопрокрутка вниз при фокусе клавиатуры
        function scrollToBottom() {
            setTimeout(() => {
                const msgContainer = document.getElementById('messages');
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }, 300);
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            if (input.value.trim()) {
                socket.emit('chat-message', { text: input.value, id: socket.id });
                input.value = '';
                scrollToBottom();
            }
        }

        function sendReaction(emoji) {
            socket.emit('chat-message', { text: emoji, id: socket.id, isReaction: true });
            spawnGhost(emoji);
        }

        socket.on('chat-message', (data) => {
            if (data.isReaction) spawnGhost(data.text);
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (data.id === socket.id ? 'my-msg' : '');
            msgDiv.textContent = data.text;
            const msgContainer = document.getElementById('messages');
            msgContainer.appendChild(msgDiv);
            msgContainer.scrollTop = msgContainer.scrollHeight;
        });

        function spawnGhost(emoji) {
            const ghost = document.createElement('div');
            ghost.className = 'ghost-float';
            ghost.textContent = emoji;
            ghost.style.left = (Math.random() * 60 + 20) + '%';
            document.body.appendChild(ghost);
            setTimeout(() => ghost.remove(), 2500);
        }

        let localStream;
        let peerConnection;
        const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function toggleVoice() {
            const btn = document.getElementById('mic-btn');
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    btn.textContent = "🎙 Вкл";
                    btn.style.background = "#2ed573";
                    socket.emit('voice-join', roomId);
                } catch (err) { alert("Нет доступа к микрофону."); }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                if (peerConnection) { peerConnection.close(); peerConnection = null; }
                btn.textContent = "🎙 Голос";
                btn.style.background = "linear-gradient(135deg, #ff6600, #cc0000)";
            }
        }

        socket.on('voice-join', async () => {
            if (!localStream) return;
            peerConnection = createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('voice-offer', { offer, roomId });
        });

        socket.on('voice-offer', async (offer) => {
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    document.getElementById('mic-btn').textContent = "🎙 Вкл";
                    document.getElementById('mic-btn').style.background = "#2ed573";
                } catch (e) { return; }
            }
            peerConnection = createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('voice-answer', { answer, roomId });
        });

        socket.on('voice-answer', async (answer) => {
            if (peerConnection) { await peerConnection.setRemoteDescription(new RTCSessionDescription(answer)); }
        });

        socket.on('voice-candidate', async (candidate) => {
            if (peerConnection && candidate) { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); }
        });

        function createPeerConnection() {
            const pc = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = (event) => { document.getElementById('remote-audio').srcObject = event.streams[0]; };
            pc.onicecandidate = (event) => {
                if (event.candidate) { socket.emit('voice-candidate', { candidate: event.candidate, roomId }); }
            };
            return pc;
        }
    </script>
</body>
</html>
