<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наш Кинотеатр ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0d0d11; 
            color: #f1f1f5; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; /* Жестко фиксируем высоту под экраны телефонов */
            overflow: hidden;
        }

        header {
            background: #16161e;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #232330;
            flex-shrink: 0;
        }

        header h1 { font-size: 15px; color: #ff5277; display: flex; align-items: center; gap: 6px; }

        .url-box {
            display: flex;
            padding: 8px 12px;
            background: #16161e;
            gap: 8px;
            border-bottom: 1px solid #232330;
            flex-shrink: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #2e2e3d;
            background: #0d0d11;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        button.btn-main {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Жесткие пропорции для видео, чтобы оно не съедало весь экран */
        .video-wrapper {
            width: 100%;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 35vh;
            flex-shrink: 0;
        }

        video, iframe, #yt-player {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }

        /* Секция чата теперь точно займет всё оставшееся место */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #121218;
            overflow: hidden;
            min-height: 0; /* Критически важно для правильного сжатия на flex-контейнерах */
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message {
            background: #1d1d27;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 80%;
            align-self: flex-start;
            word-break: break-word;
            border-bottom-left-radius: 4px;
        }

        .message.my-msg {
            align-self: flex-end;
            background: #ff4757;
            color: white;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 4px;
        }

        .reactions-bar {
            display: flex;
            justify-content: space-around;
            padding: 6px;
            background: #16161e;
            border-top: 1px solid #232330;
            font-size: 20px;
            flex-shrink: 0;
        }

        .reactions-bar span {
            cursor: pointer;
            transition: transform 0.1s;
        }

        .reactions-bar span:active {
            transform: scale(1.4);
        }

        .chat-input {
            display: flex;
            padding: 8px 12px;
            background: #16161e;
            gap: 8px;
            flex-shrink: 0;
        }

        .heart-float {
            position: fixed;
            bottom: 70px;
            font-size: 28px;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
        }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <header>
        <h1>Наш Кинотеатр 💖</h1>
        <button class="btn-main" id="mic-btn" onclick="toggleVoice()" style="display:none;">🎙 Голос</button>
    </header>

    <div class="url-box">
        <input type="text" id="video-url" placeholder="Ссылка на YouTube или .mp4...">
        <button class="btn-main" onclick="loadUrl()">▶ См</button>
        <label style="background:#232330; padding:6px 10px; border-radius:20px; font-size:12px; cursor:pointer; display:flex; align-items:center;">
            📁
            <input type="file" id="file-input" accept="video/*" style="display:none" onchange="loadLocalFile(event)">
        </label>
    </div>

    <div class="video-wrapper">
        <div id="yt-player"></div>
        <video id="html-player" controls playsinline webkit-playsinline style="display:none;"></video>
    </div>

    <div class="chat-section">
        <div class="messages" id="messages"></div>

        <div class="reactions-bar">
            <span onclick="sendReaction('❤️')">❤️</span>
            <span onclick="sendReaction('💖')">💖</span>
            <span onclick="sendReaction('😂')">😂</span>
            <span onclick="sendReaction('🍿')">🍿</span>
            <span onclick="sendReaction('🥺')">🥺</span>
        </div>

        <form class="chat-input" onsubmit="sendMessage(event)">
            <input type="text" id="msg-input" placeholder="Написать сообщение...">
            <button class="btn-main" type="submit">></button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const roomId = "our-private-cinema";
        socket.emit('join-room', roomId);

        let ytPlayer = null;
        let isApiReady = false;
        let isRemoteAction = false;

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: { 'playsinline': 1, 'controls': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function extractYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadUrl() {
            const url = document.getElementById('video-url').value.trim();
            const ytId = extractYTId(url);
            if (ytId) {
                socket.emit('change-source', { type: 'yt', id: ytId });
            } else if (url) {
                socket.emit('change-source', { type: 'url', src: url });
            }
        }

        function loadLocalFile(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                socket.emit('change-source', { type: 'local', src: fileURL });
            }
        }

        function onPlayerStateChange(event) {
            if (isRemoteAction || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
            const time = ytPlayer.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) {
                socket.emit('video-action', { type: 'play', time: time });
            } else if (event.data === YT.PlayerState.PAUSED) {
                socket.emit('video-action', { type: 'pause', time: time });
            }
        }

        socket.on('video-action', (data) => {
            if (!ytPlayer || typeof ytPlayer.seekTo !== 'function') return;
            isRemoteAction = true;
            const currentTime = ytPlayer.getCurrentTime();
            if (Math.abs(currentTime - data.time) > 1.0) {
                ytPlayer.seekTo(data.time, true);
            }
            if (data.type === 'play') ytPlayer.playVideo();
            else if (data.type === 'pause') ytPlayer.pauseVideo();
            setTimeout(() => { isRemoteAction = false; }, 500);
        });

        socket.on('change-source', (data) => {
            if (data.type === 'yt') {
                document.getElementById('html-player').style.display = 'none';
                document.getElementById('yt-player').style.display = 'block';
                if (isApiReady && ytPlayer && ytPlayer.loadVideoById) {
                    ytPlayer.loadVideoById(data.id);
                }
            } else if (data.type === 'local' || data.type === 'url') {
                document.getElementById('yt-player').style.display = 'none';
                const htmlPlayer = document.getElementById('html-player');
                htmlPlayer.style.display = 'block';
                htmlPlayer.src = data.src;
                htmlPlayer.play();
            }
        });

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            if (input.value.trim()) {
                socket.emit('chat-message', { text: input.value, id: socket.id });
                input.value = '';
            }
        }

        function sendReaction(emoji) {
            socket.emit('chat-message', { text: emoji, id: socket.id, isReaction: true });
            spawnHeart(emoji);
        }

        socket.on('chat-message', (data) => {
            if (data.isReaction) spawnHeart(data.text);
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (data.id === socket.id ? 'my-msg' : '');
            msgDiv.textContent = data.text;
            const msgContainer = document.getElementById('messages');
            msgContainer.appendChild(msgDiv);
            msgContainer.scrollTop = msgContainer.scrollHeight;
        });

        function spawnHeart(emoji) {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.textContent = emoji;
            heart.style.left = (Math.random() * 60 + 20) + '%';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }

        let localStream;
        async function toggleVoice() {
            const btn = document.getElementById('mic-btn');
            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    btn.textContent = "🎙 Вкл";
                    btn.style.background = "#2ed573";
                } catch (err) {
                    alert("Нет доступа к микрофону");
                }
            } else {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                btn.textContent = "🎙 Голос";
                btn.style.background = "linear-gradient(135deg, #ff4757, #ff6b81)";
            }
        }
    </script>
</body>
</html>
